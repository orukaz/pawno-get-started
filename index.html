<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawno Get Started Header Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pawno: {
                green: "#56ce7d",
                deep: "#101827",
                ink: "#080d1f",
                mist: "#f6faf8",
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-pawno-mist text-pawno-ink antialiased">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const navLinks = [
        { label: "How it works", href: "#how-it-works" },
        { label: "What you can pawn", href: "#items" },
        { label: "Support", href: "#support" },
      ];

      function Header() {
        return (
          <header className="site-header sticky top-0 z-50 border-b border-slate-200/80 bg-white/90 backdrop-blur">
            <div className="mx-auto flex h-24 max-w-7xl items-center justify-between gap-6 px-6 lg:px-10">
              <a href="#" className="flex items-center gap-3" aria-label="Pawno home">
                <span className="logo-frame">
                  <img src="./assets/pawno-logo.svg" alt="Pawno" className="h-8 w-auto" />
                </span>
              </a>

              <nav className="hidden items-center gap-8 text-[15px] font-semibold text-slate-600 lg:flex">
                {navLinks.map((link) => (
                  <a key={link.href} href={link.href} className="transition hover:text-pawno-ink">
                    {link.label}
                  </a>
                ))}
              </nav>

              <div className="flex items-center gap-3 sm:gap-4">
                <div className="language-switch" aria-label="Language switcher">
                  <button type="button" className="language-switch__option language-switch__option--active">
                    EN
                  </button>
                  <button type="button" className="language-switch__option">
                    ES
                  </button>
                </div>

                <a
                  href="#sign-in"
                  className="hidden h-12 items-center gap-3 rounded-md bg-pawno-deep px-6 text-[15px] font-bold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-black sm:inline-flex"
                >
                  Sign in
                  <span aria-hidden="true" className="text-2xl leading-none">
                    →
                  </span>
                </a>

                <a
                  href="#get-started"
                  className="inline-flex h-12 items-center justify-center rounded-md bg-pawno-green px-5 text-[15px] font-bold text-pawno-deep shadow-[0_10px_24px_rgba(86,206,125,0.25)] transition hover:-translate-y-0.5 hover:bg-[#4ac372]"
                >
                  Get started
                </a>
              </div>
            </div>
          </header>
        );
      }

      function HeroPreview() {
        return (
          <main className="mx-auto grid min-h-[calc(100vh-6rem)] max-w-7xl items-center gap-10 px-6 py-16 lg:grid-cols-[0.95fr_1.05fr] lg:px-10">
            <section className="max-w-2xl">
              <p className="mb-4 text-sm font-bold uppercase tracking-[0.18em] text-pawno-green">Fast start</p>
              <h1 className="text-4xl font-bold leading-tight tracking-tight text-pawno-ink sm:text-5xl">
                Get started with Pawno before the full application.
              </h1>
              <p className="mt-5 text-lg leading-8 text-slate-600">
                Capture campaign visitors with a simpler account flow, save them as draft leads, and let them continue
                valuation details when they are ready.
              </p>
              <div className="mt-8 flex flex-wrap gap-3 text-sm font-semibold text-slate-700">
                <span className="trust-pill">No obligation</span>
                <span className="trust-pill">Secure and private</span>
                <span className="trust-pill">Photos can be added later</span>
              </div>
            </section>

            <section className="rounded-lg border border-slate-200 bg-white p-6 shadow-[0_24px_70px_rgba(15,23,42,0.10)]">
              <div className="mb-5 flex items-center justify-between">
                <div>
                  <h2 className="text-xl font-bold text-pawno-ink">Create your Pawno account</h2>
                  <p className="mt-1 text-sm text-slate-500">A lightweight lead form would sit here.</p>
                </div>
                <span className="rounded-full bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700">Draft saved</span>
              </div>
              <div className="grid gap-4 sm:grid-cols-2">
                <div className="field-placeholder">First name</div>
                <div className="field-placeholder">Last name</div>
                <div className="field-placeholder sm:col-span-2">Email address</div>
                <div className="field-placeholder sm:col-span-2">Mobile phone</div>
                <div className="field-placeholder sm:col-span-2">What might you pawn?</div>
              </div>
            </section>
          </main>
        );
      }

      function App() {
        return (
          <>
            <Header />
            <HeroPreview />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
