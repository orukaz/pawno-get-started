<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pawno Header Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#ffffff",
              foreground: "#020618",
              muted: "#f1f5f9",
              "muted-foreground": "#62748e",
              accent: "#f1f5f9",
              "accent-foreground": "#0f172b",
              primary: "#0f172b",
              "primary-foreground": "#f8fafc",
              brand: "#00CC77",
              pawno: {
                green: "#00CC77",
                greenDark: "#009767",
                ink: "#020618",
                navy: "#0f172b",
                mist: "#f6faf8",
                line: "#e5ebf1",
              },
            },
            fontFamily: {
              sans: ["Geist", "Geist Fallback", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-gray-50 font-sans text-foreground antialiased">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const navLinks = [
        { label: "Money Deposit", href: "https://www.pawno.io/en/money-deposit" },
        { label: "How Pawno Works", href: "https://www.pawno.io/en/how-pawno-works" },
        { label: "Loan Calculator", href: "https://www.pawno.io/en/calculator?type=metals" },
      ];

      const accountLinks = {
        signIn: "https://www.pawno.io/en/sign-in",
        getStarted: "./get-started.html",
        registerStore: "https://join.pawno.io/en",
      };

      function ArrowRightIcon({ className = "h-5 w-5" }) {
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            aria-hidden="true"
          >
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        );
      }

      function MenuIcon({ className = "h-6 w-6" }) {
        return (
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            aria-hidden="true"
          >
            <path d="M4 7h16" />
            <path d="M4 12h16" />
            <path d="M4 17h16" />
          </svg>
        );
      }

      function Header() {
        const [isMenuOpen, setIsMenuOpen] = React.useState(false);

        return (
          <header className="sticky top-0 z-50 bg-white shadow-md">
            <div className="lg:hidden">
              <div className={`fixed inset-0 z-40 bg-black/50 ${isMenuOpen ? "" : "hidden"}`} onClick={() => setIsMenuOpen(false)} role="button" tabIndex="0"></div>
              <aside className={`fixed top-0 right-0 z-50 h-full w-64 transform bg-white transition-transform duration-300 ${isMenuOpen ? "translate-x-0" : "translate-x-full"}`} aria-hidden={!isMenuOpen}>
                <div className="p-4">
                  <button
                    type="button"
                    className="absolute top-4 right-4 inline-flex h-9 shrink-0 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-md px-4 py-2 text-sm font-medium outline-none transition-all hover:bg-accent hover:text-accent-foreground"
                    onClick={() => setIsMenuOpen(false)}
                  >
                    Close
                  </button>
                  <nav className="mt-8 space-y-4" aria-label="Mobile navigation">
                    {navLinks.map((link) => (
                      <a key={link.href} href={link.href} className="block py-2">
                        {link.label}
                      </a>
                    ))}
                    <a href={accountLinks.registerStore} className="block py-2 font-medium text-emerald-600">
                      Register your store
                    </a>
                    <a href={accountLinks.signIn} className="block py-2">Sign In</a>
                  </nav>
                </div>
              </aside>

              <div className="header-container flex min-h-[4.5rem] items-center justify-between gap-4">
                <a href="./index.html" className="header-logo" aria-label="Pawno home">
                  <img src="./assets/pawno-logo.svg" alt="Pawno" />
                </a>
                <div className="flex items-center gap-3">
                  <a href={accountLinks.getStarted} className="inline-flex min-h-10 shrink-0 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-md bg-brand px-3.5 text-sm font-semibold text-white shadow-sm transition-all hover:bg-brand/90">
                    Create your account
                  </a>
                  <button
                    type="button"
                    className="inline-flex h-9 shrink-0 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-md p-2 text-sm font-medium outline-none transition-all hover:bg-accent hover:text-accent-foreground"
                    aria-label="Open navigation"
                    onClick={() => setIsMenuOpen(true)}
                  >
                    <MenuIcon />
                  </button>
                </div>
              </div>
            </div>

            <div className="hidden lg:block">
              <div className="header-container py-4">
                <div className="flex items-center justify-between gap-6">
                  <div className="flex min-w-0 items-center gap-8 xl:gap-10">
                    <a href="./index.html" className="header-logo" aria-label="Pawno home">
                      <img src="./assets/pawno-logo.svg" alt="Pawno" />
                    </a>

                    <nav className="hidden px-0 xl:block" aria-label="Main navigation">
                      <ul className="flex items-center gap-6 text-sm xl:gap-8">
                        {navLinks.map((link) => (
                          <li key={link.href}>
                            <a href={link.href} className="hover:bg-gradient-to-r hover:from-cyan-500 hover:via-emerald-500 hover:to-teal-400 hover:bg-clip-text hover:text-transparent hover:underline">
                              {link.label}
                            </a>
                          </li>
                        ))}
                      </ul>
                    </nav>
                  </div>

                  <div className="flex shrink-0 items-center gap-4">
                    <a href={accountLinks.registerStore} className="text-sm font-medium transition-colors hover:text-emerald-600">
                      Register your store
                    </a>

                    <div className="inline-flex items-center rounded-full border bg-muted/40 p-0.5" aria-label="Language switcher">
                      <button type="button" className="relative inline-flex items-center gap-1.5 rounded-full bg-background px-3 py-1.5 text-xs font-medium text-foreground shadow-sm transition-all">
                        EN
                      </button>
                      <button type="button" className="relative inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs font-medium text-muted-foreground transition-all hover:text-foreground">
                        ES
                      </button>
                    </div>

                    <a
                      href={accountLinks.signIn}
                      className="flex h-9 w-[120px] shrink-0 cursor-pointer items-center justify-between gap-2 whitespace-nowrap rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground shadow-sm outline-none transition-all hover:bg-primary/90"
                    >
                      <span className="text-xs font-medium">Sign In</span>
                      <ArrowRightIcon className="h-5 w-5" />
                    </a>

                    <a
                      href={accountLinks.getStarted}
                      className="inline-flex h-9 shrink-0 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-md bg-brand px-4 py-2 text-sm font-semibold text-white shadow-sm outline-none transition-all hover:bg-brand/90"
                    >
                      Create your account
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </header>
        );
      }

      function HeaderPreview() {
        return <main className="header-preview-page" aria-label="Header prototype preview"></main>;
      }

      function App() {
        return (
          <>
            <Header />
            <HeaderPreview />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
