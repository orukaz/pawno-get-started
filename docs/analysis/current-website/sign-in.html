iled\":\"Failed to update preferences\"}},\"tabs\":{\"recent\":\"Recent\",\"read\":\"Read\"},\"empty\":{\"unread\":\"No unread notifications\",\"read\":\"No read notifications\"},\"mark-all-as-read\":\"Mark all as read\",\"item\":{\"view\":\"View\",\"status-changed-from\":\"Your application status has changed from\",\"status-changed-to\":\"to\",\"titles\":{\"application-status-updated\":\"Application Status Updated\",\"new-application-submitted\":\"New Application Submitted\",\"new-offer-available\":\"New Offer Available\",\"contract-ready-for-signing\":\"Contract Ready for Signing\",\"contract-signed\":\"Contract Signed\",\"delivery-update\":\"Delivery Update\",\"kyc-status-updated\":\"KYC Status Updated\",\"pawnshop-settings-updated\":\"Pawnshop Settings Updated\",\"catalog-updated\":\"Catalog Updated\",\"new-message\":\"New Message\"},\"priority\":{\"urgent\":\"Urgent\",\"high\":\"High\",\"medium\":\"Medium\",\"low\":\"Low\"}}},\"homepage\":{\"hero-section\":{\"title\":\"First online pawning platform in Spain\",\"subtitle\":\"Pawn from the sofa - it's that easy!\",\"get-started\":\"Get started\"},\"features-section\":{\"badge\":\"Features\",\"title\":\"The Easiest Way to Get a Loan with Your Valuables\",\"description\":\"Experience a modern, secure, and hassle-free way to get loans using your valuables as collateral.\",\"cta\":\"Sign in\",\"features\":{\"1\":{\"title\":\"Convenience\",\"description\":\"No need to visit a pawn shop; apply for a loan on the Pawno website in just a few minutes\"},\"2\":{\"title\":\"Safe \u0026 Private\",\"description\":\"Your collateral is 100% insured for the entire loan period\"},\"3\":{\"title\":\"Fast Payments\",\"description\":\"Receive money to your bank account within a few hours\"}}},\"how-it-works-section\":{\"title\":\"The Future of Pawning Is Here\",\"subtitle\":\"Discover our secure, convenient, and modern online service.\",\"how-it-works\":\"How It Works?\",\"steps\":{\"1\":{\"title\":\"Submit your collateral on the Pawno website and receive an instant loan offer\",\"description\":\"Fill out a simple form and upload photos of your valuable item. Experts will evaluate your item and provide a preliminary valuation.\"},\"2\":{\"title\":\"A Pawno courier comes to collect your item\",\"description\":\"After you confirm the loan offer, a courier will come to your door to deliver your insured item to a Pawno location. Alternatively, we'll guide you to the nearest physical Pawno branch.\"},\"3\":{\"title\":\"Get Your Money Fast\",\"description\":\"Accept the offer and sign the agreement – all from the comfort of your home using the Pawno platform.\"},\"4\":{\"title\":\"Redeem or Extend\",\"description\":\"To reclaim your item, repay the loan or extend the term. Your item will be delivered back to your doorstep.\"}},\"cta\":\"Get Started\"},\"services-section\":{\"title\":\"Our Services\",\"cta-get-started\":\"Get Started\",\"services\":{\"1\":{\"title\":\"Precious Metals\",\"description\":\"Pawning gold and diamonds allows you to quickly receive a larger amount of money while retaining the right to buy back your jewelry later.\"},\"2\":{\"title\":\"Luxury Watches\",\"description\":\"Patek Philippe, Tag Heuer, Rolex, Cartier, Tissot, Omega, Bulgari, Apple, and more – Pawno offers loans for watches from these brands.\"},\"3\":{\"title\":\"Smartphones\",\"description\":\"Is your old or new phone just lying around? Turn it into cash with Pawno.\"},\"4\":{\"title\":\"Laptops\",\"description\":\"With Pawno, you can quickly turn your tablet into cash. We offer both pawning and direct purchase – always at a fair price.\"}},\"service-cta\":\"Evaluate\"},\"advantages-section\":{\"title\":\"The Pawno Advantage\",\"cta-get-started\":\"Get Started\",\"advantages\":{\"1\":{\"title\":\"Fast Cash\",\"description\":\"Money is transferred to your bank account or paid in cash on the same day.\"},\"2\":{\"title\":\"Best Valuation\",\"description\":\"Don't settle for less – get more for your collateral with us than anywhere else.\"},\"3\":{\"title\":\"Convenience\",\"description\":\"Online pawnshop – get a loan without leaving home, Mobile pawn service – we come to your home to collect the item\"},\"4\":{\"title\":\"Reliability\",\"description\":\"Your item is 100% insured and stored in a secure vault under 24/7 video surveillance.\"},\"5\":{\"title\":\"Availability\",\"description\":\"Over 500 Pawno locations provide service across Spain (including the islands)\"},\"6\":{\"title\":\"We Accept Almost Everything\",\"description\":\"A wide range of accepted items and a personalized approach.\"}}},\"faq-section\":{\"title\":\"Frequently Asked Questions\",\"questions\":{\"1\":{\"question\":\"What is Pawno's distance lending service?\",\"answer\":\"Think of it as a convenient way to use our online pawning platform. You can pawn gold, pawn jewelry, or use electronics as collateral, all from the comfort of your home. It's the modern way to get a secured loan fast!\"},\"2\":{\"question\":\"What kind of Items does Pawno accept as collateral?\",\"answer\":\"We welcome a wide range of items! You can pawn gold and silver jewelry (with or without stones), high-end gold or steel watches, electronics, home appliances, designer handbags, collectibles and valuable pieces of art.\"},\"3\":{\"question\":\"How much does it cost to send my item by mail?\",\"answer\":\"We are connected with a range of different courier service offering companies, who will handle your valuable item with security and care. The shipping conditions and price will depend on the chosen method, taken into account your location and the matched pawnshop address. You will be able to choose the price and conditions during the application process.\"},\"4\":{\"question\":\"How do I send my item to the pawnshop?\",\"answer\":\"We make it easy! A postman will come right to your door to pick up your parcel, or you can choose the most suitable post service for you from your account on the Pawno platform, just before finishing the process. Your item will be delivered to the pawnshop, fully insured by the courier service you have chosen.\"},\"5\":{\"question\":\"Do transactions made at Pawno's platform affect my credit history?\",\"answer\":\"Not at all! We keep your information private and don't share any transaction details or personal data with banks or lending institutions.\"},\"6\":{\"question\":\"Is the item I wish to pawn insured when sent by using a postal service?\",\"answer\":\"Yes! You will choose the delivery method together with the appropriate insurance just before finishing up application process. You will see the shipping price together with the insurance conditions before you send your item.\"},\"7\":{\"question\":\"Can you guarantee that my item will be protected at the pawnshop where it's stored when I pawn through Pawno's platform?\",\"answer\":\"Absolutely! We take security seriously. All items are fully insured through the courier company. Our partner warehouses are 100% secure and protected 24/7 with advanced security systems.\"}},\"help-center\":\"Help Center\"},\"simple-steps-section\":{\"title\":\"Five simple steps to get your money\",\"steps\":{\"1\":{\"title\":\"Pawn or Sell?\",\"time\":\"1 MIN\"},\"2\":{\"title\":\"Describe \u0026 Get Estimate\",\"time\":\"5 MIN\"},\"3\":{\"title\":\"Pick a shop \u0026 Verify with Didit\",\"time\":\"10 MIN\"},\"4\":{\"title\":\"Walk-In or Delivery \u0026 Sign\",\"time\":\"SAME DAY\"},\"5\":{\"title\":\"Receive your money\",\"time\":\"WITHIN 24H\"}}}},\"about-us\":{\"title\":\"Breaking Traditional Barriers:\",\"title-highlight\":\"Spain's First Digital Pawn Shop\",\"subtitle\":\"Experience the future of pawning with Pawno. We're revolutionizing how Spain accesses fast, reliable, and secure financial solutions.\",\"text\":\"Drawing from extensive global experience in fast loan markets across Europe, South America, and Asia, Pawno's founders have reimagined the concept of pawning. Today, Pawno stands as Spain's first online pawn shop, leading the modernization of the pawnbroking industry. \u003cbr /\u003e\u003cbr/\u003eOur mission is simple: to provide all Spaniards with the most reliable and user-friendly secured loan service at their fingertips 24/7. Whether you need to sell gold, pawn jewelry, or secure a quick loan, Pawno is here to help!\",\"cta\":\"Get Started\",\"features-section\":{\"features\":{\"1\":{\"title\":\"Quality\",\"description\":\"Our team of highly qualified professionals guarantees a first-class service.\"},\"2\":{\"title\":\"Anonymity\",\"description\":\"Your privacy is our priority: all transactions are 100% confidential.\"},\"3\":{\"title\":\"Security\",\"description\":\"We safeguard your pawned goods with the utmost reliability and care.\"},\"4\":{\"title\":\"Speed\",\"description\":\"From application to money in your account: process loans in just minutes.\"}}},\"company-values\":{\"values\":{\"1\":{\"title\":\"Mission\",\"description\":\"Making reliable, fast-secured loans accessible to every Spaniard, 24/7.\"},\"2\":{\"title\":\"Vision\",\"description\":\"Pioneering the digital future of pawnbroking, expanding financial opportunities across the globe.\"},\"3\":{\"title\":\"Core Values\",\"description\":\"Customers at the heart of our service\"}},\"core-values\":{\"1\":\"Customers at the heart of our service\",\"2\":\"Pioneering digital financial solutions\",\"3\":\"Unwavering ethics in every transaction\",\"4\":\"Setting new standards in financial services\",\"5\":\"United in mission, stronger together\"}},\"contact-section\":{\"contact-information\":\"Contact Information\",\"contact-information-description\":\"Our goal is to provide fast, secure, and reliable service. If you have any questions about our services, pricing, or process, feel free to contact us. We will be happy to assist you.\",\"company-location\":\"Company Location\",\"company-location-address\":\"C/ AYALA 11 -PLANTA 1 28001, MADRID\",\"company-details\":\"Company Details\",\"company-details-description\":\"Our goal is to provide fast, secure, and reliable service. If you have any questions about our services, pricing, or process, feel free to contact us. We will be happy to assist you.\",\"email\":\"Email\"}},\"money-deposit\":{\"title\":\"Money Deposit\",\"subtitle\":\"What You Can Pawn\",\"text\":\"At Pawno, we turn your valuable items into financial opportunities. In our online pawnshop, you can sell or pawn a wide variety of items – from gold and silver jewelry to an unused iPhone, luxury watches, video game consoles, and even unique works of art!\u003cbr /\u003e\u003cbr /\u003eDiscover why we're the preferred choice across Spain for those looking to quickly, securely, and discreetly turn their sentimental and valuable items into cash. You can find a full list of accepted items in the categories below.\",\"search-placeholder\":\"Search for your pawn item\",\"categories\":{\"1\":{\"name\":\"Precious Metals\"},\"2\":{\"name\":\"Luxury Watches\"},\"3\":{\"name\":\"Smartphones\"},\"4\":{\"name\":\"Laptops\"},\"5\":{\"name\":\"Tablets\"},\"6\":{\"name\":\"Game consoles\"},\"7\":{\"name\":\"Art\"},\"8\":{\"name\":\"Luxury Accessories\"}},\"available-items\":\"Available Items\"},\"how-pawno-works\":{\"title\":\"How Pawno Works\",\"features\":{\"1\":{\"text\":\"Fill out a 5-minute quick form\"},\"2\":{\"text\":\"Get an instant pre-evaluation and sign your online agreement\"},\"3\":{\"text\":\"Flexible delivery: courier pickup or drop off your item at a Pawno location\"},\"4\":{\"text\":\"Receive payment within a few hours\"}},\"benefits-title\":\"Why Pawno? Your Financial Freedom, Simplified\",\"benefits\":{\"1\":{\"title\":\"Full Flexibility, Always in Your Hands\",\"description\":\"Take control of your loan journey. Renew, adjust, or modify your contract whenever you need, without complicated procedures or hidden barriers.\"},\"2\":{\"title\":\"Financial Challenges? We're Your Partner\",\"description\":\"Struggling to buy out or renew your contract? Don't worry! At Pawno, we're here to help. Let's work together to find a solution that fits your situation.\"},\"3\":{\"title\":\"Zero Judgment, Total Understanding\",\"description\":\"Didn't redeem your pawned item? There's no need to stress. At our pawn shop, your credibility remains untouched. We welcome you back anytime, with no obligations or negative impact on your borrower status.\"},\"4\":{\"title\":\"Maximum Value, Guaranteed\",\"description\":\"We promise the most competitive rates in the market. Our transparent pricing means you'll always get the fairest, most attractive offer for your valuable items.\"}}},\"help-center\":{\"pageTitle\":\"Help Center\",\"mainHeading\":\"Frequently Asked Questions\",\"categories\":[{\"id\":\"loanProcess\",\"title\":\"Loan Process\",\"faqs\":[{\"q\":\"What services does Pawno offer?\",\"a\":\"At Pawno, we're your go-to online pawn platform. We're here to help you with two main services: pawn loans secured by your valuable items, and we also buy items at competitive prices. Whether you want to pawn gold, sell jewelry, or get a quick loan on electronics, we've got you covered.\"},{\"q\":\"How can I apply for a loan?\",\"a\":\"It's a breeze! Just head over to www.pawno.io, and we'll guide you through the entire process step by step.\"},{\"q\":\"What is Pawno's distance lending service?\",\"a\":\"Think of it as a convenient way to use our online pawning platform. You can pawn gold, pawn jewelry, or use electronics as collateral, all from the comfort of your home. It's the modern way to get a secured loan fast!\"},{\"q\":\"What do I need to become a Pawno customer?\",\"a\":\"To use our online pawn platform services, Spanish nationals just need their DNI. Expats who are registrated Spanish residents, please bring your registration certificate, NIE along with your national passport or ID.\"},{\"q\":\"What kind of Items does Pawno accept as collateral?\",\"a\":\"We welcome a wide range of items! You can pawn gold and silver jewelry (with or without stones), high-end gold or steel watches, electronics, home appliances, designer handbags, collectibles and valuable pieces of art.\"},{\"q\":\"Does my credit history matter?\",\"a\":\"Not at all! Our pawnshop is only interested in the item you're offering as collateral. We don't check your credit history or ask for bank statements.\"},{\"q\":\"How much money will I get for my item?\",\"a\":\"At Pawno, the amount we offer depends on a few key factors:\\nMarket value\\nCondition\\nCurrent demand\\nThe more valuable your item, the more we can offer. We check prices from sources like Milanuncios, eBay, and Cash Converters, and compare with new product prices.\\nFor example, if you want to pawn gold or sell jewelry, we'll look at current market rates. For electronics, like an iPhone that costs €500 new and €350 used, we might offer around €175-250.\\nPro tip: To get the best offer when you pawn jewelry or sell electronics:\\nClean your item thoroughly\\nInclude original packaging if possible\\nProvide charger, purchase receipt, and all accessories\\nRemember, we can't accept broken, damaged, or non-original items.\"},{\"q\":\"At what age can I pawn and sell items?\",\"a\":\"If you're 18 or older, you're good to go! There's no upper age limit for pawning or selling items with us.\"},{\"q\":\"How do you determine the value of my collateral?\",\"a\":\"We will ask you a series of questions about your item. Based on your answers, our expert appraisers provide a preliminary valuation whether you want to pawn jewellery or sell gold, or get a loan on arts. Remember, the final valuation happens once we receive and inspect the item in person. If we need more info, we'll reach out directly.\"},{\"q\":\"What is an initial assessment or pre-assessment?\",\"a\":\"It's our expert's best estimate based on the information you provide about your item's condition, age, weight, brand, and other factors.\"},{\"q\":\"Is it possible to get a cash loan from Pawno?\",\"a\":\"Yes, if you visit a Pawno loan point in person, we can provide a cash loan. However, for items sent by mail, we can't offer cash loans.\"},{\"q\":\"How long does it take to fill out the form to get an initial estimate?\",\"a\":\"Getting an initial estimate from our online pawn shop is quick and easy - it takes just 5 minutes!\\nHere's what you need to do:\\nSelect the product you want to sell or pawn\\nFill out our simple form with information and photos of your item\\nThat's it! You'll receive an instant initial estimate as soon as you complete the form. Whether you're looking to sell jewelry, pawn gold, or get a loan on electronics, we make the process fast and straightforward.\"},{\"q\":\"What factors are considered when giving an initial price estimation offer?\",\"a\":\"Our system considers many factors: the product's age, condition, technical features, internal functions, market demand, and more. We aim to give you the most accurate initial assessment possible.\"}]},{\"id\":\"shipping\",\"title\":\"Shipping \u0026 Item Handling\",\"faqs\":[{\"q\":\"How much does it cost to send my item by mail?\",\"a\":\"We are connected with a range of different courier service offering companies, who will handle your valuable item with security and care. The shipping conditions and price will depend on the chosen method, taken into account your location and the matched pawnshop address. You will be able to choose the price and conditions during the application process.\"},{\"q\":\"What happens if I incorrectly describe my item in the application form?\",\"a\":\"In case you have made a mistake describing your item and there is a significant difference, the pawnshop manager will give you a call. They'll let you know the actual valuation of your item and discuss the possible loan terms with you personally over the phone-call.\"},{\"q\":\"What if I described the item incorrectly, and I am not willing to accept a loan for less than the preliminary offer?\",\"a\":\"You have two options: 1) You can pay for postage and insurance, and the pawnshop will return the item to you. 2) You can choose to leave the item with the pawnshop, but you'll still need to cover the postage and insurance amount that was spent in sending the item to the pawnshop in the first place.\"},{\"q\":\"How do I send my item to the pawnshop?\",\"a\":\"We make it easy! A postman will come right to your door to pick up your parcel, or you can choose the most suitable post service for you from your account on the Pawno platform, just before finishing the process. Your item will be delivered to the pawnshop, fully insured by the courier service you have chosen.\"},{\"q\":\"How should I prepare a parcel for shipping?\",\"a\":\"Protect your item with care. Wrap jewelry in paper or protective material. For watches, use the original box if you have it. If not, any sturdy box will do - just make sure it's well-sealed.\"},{\"q\":\"Is the item I wish to pawn insured when sent by using a postal service?\",\"a\":\"Yes! You will choose the delivery method together with the appropriate insurance just before finishing up application process. You will see the shipping price together with the insurance conditions before you send your item.\"},{\"q\":\"How quickly will the postman pick up the parcel and take it to the pawn shop?\",\"a\":\"The postman will collect your item depending on the courier method you have chosen.\"},{\"q\":\"Can I sell or pawn my item if I am located in the Balearic Islands?\",\"a\":\"You can pawn and/or sell your item from both the Canary and Balearic Islands. Once you accept the initial evaluation, you'll need to send your item to the pawnshop. We'll either send a postman to collect them or direct you to the nearest Pawno pawning point.\"},{\"q\":\"Can I sell or pawn from Ceuta or Melilla?\",\"a\":\"Of course! From Ceuta and Melilla, you can either mail your item or we'll guide you to the nearest Pawno pawn point in your area. Pawno online pawning points are available throughout Spain!\"}]},{\"id\":\"repayment\",\"title\":\"Loan Repayment \u0026 Extension\",\"faqs\":[{\"q\":\"How do I repay my loan?\",\"a\":\"It's simple! Pay on or before the due date using the bank details in your agreement. You can also find a payment link in your Pawno client account.\"},{\"q\":\"How do I extend my loan?\",\"a\":\"Need more time? No problem! Just pay the full interest amount to extend your loan for another month. You can use the same payment methods as for repaying your loan.\"},{\"q\":\"What is the maximum loan period?\",\"a\":\"Our standard loan period is 90 days, but you can extend it by 30 days at a time. After three extensions, we'll reassess the value of your collateral.\"},{\"q\":\"What are the interest rates, and are there other fees?\",\"a\":\"The pawnshops offer flexible terms and interest packages based on the type of collateral. Interest rates range from 1-15% per month.\"}]},{\"id\":\"valuation\",\"title\":\"Item Specifics \u0026 Valuation\",\"faqs\":[{\"q\":\"Can I sell or pawn my products without sending real photos of them?\",\"a\":\"We require actual photos of your item - no internet downloads allowed! To get an accurate assessment, please send 3-5 clear pictures showing the front, back, and any accessories or original packaging. If you have accessories or the box, please take a photo of them as well. The more detailed and comprehensive your photos are, the faster we can give you a response, and the more accurate the initial estimate will be, whether you want to sell jewelry, pawn gold, or get a loan on electronics.\"},{\"q\":\"Can I pawn multiple items, such as an iPhone and a ring, together?\",\"a\":\"You'll just need to make two separate loan applications, one for each item.\"},{\"q\":\"What should you know before selling or pawning precious metals?\",\"a\":\"Before you sell gold or pawn jewelry, keep these tips in mind:\\nDo your homework: Research current market values to get a rough idea of your item's worth.\\nKnow your metal: Understanding the purity and weight of your gold or silver can help you estimate its value.\\nCheck the condition: While we accept precious metals in various conditions, damage or wear might affect the value.\\nKeep your paperwork: Any documentation or proof of purchase can help verify authenticity and potentially increase value.\\nAt Pawno, we're here to help you get the best value for your precious metals!\"},{\"q\":\"What types of gold does Pawno accept?\",\"a\":\"Pawno accepts various types of gold:\\n24-karat (24K): Pure gold, 99.9% purity. Soft and malleable.\\n22-karat (22K): 91.7% pure gold, mixed with other metals for durability.\\n18K: 75% pure gold, popular for high-quality jewelry.\\n14-karat (14K): 58.3% pure gold, offers a good balance of strength and value.\\n10K: 41.7% pure gold, more affordable and durable.\\nWhether you want to sell gold or pawn jewelry, we accept all these types!\"},{\"q\":\"Can I sell or pawn all types of jewelry?\",\"a\":\"$20\"},{\"q\":\"Can I pawn damaged jewelry?\",\"a\":\"Pawno understands that jewelry can show signs of wear over time. While damage or tarnish might affect the value, we still offer fair quotes based on the metal's purity and other factors.\\nThe expert appraisers carefully examine each piece, considering any needed repairs or restoration. So, whether you're looking to pawn jewelry or sell gold, don't hesitate to bring in your items, even if they're not in perfect condition.\"},{\"q\":\"Can I pawn damaged electronics?\",\"a\":\"We're pretty flexible! Minor scratches are usually fine, but we can't accept electronics that won't power on or have broken displays. If you're unsure, contact our support for guidance.\"},{\"q\":\"What happens if I don't know the purity of the precious metal I'm selling or pawning?\",\"a\":\"No worries! The experts at the pawn shops are trained to assess the purity of your items using professional methods like acid testing to determine gold purity.\\nWhile it's not always possible to give an exact karat without lab analysis, the expert team can make a close estimate. The final quote is based on this estimate, along with factors like weight, market demand, and item condition.\\nSo, whether you're looking to sell gold or pawn jewelry, you don't need to know the exact purity. We've got you covered!\"},{\"q\":\"Do the prices of gold and silver fluctuate daily?\",\"a\":\"Yes, they do. Gold and silver prices fluctuate based on the London and New York markets. We're committed to offering you the best price per gram, always adjusted to the current market value.\"}]},{\"id\":\"selling\",\"title\":\"Selling Items\",\"faqs\":[{\"q\":\"How can I sell my possessions quickly and easily?\",\"a\":\"Selling your items with Pawno is easy! Here's how:\\nVisit www.pawno.io and fill out our sales application.\\nThe experts will provide a FREE initial appraisal and make you a fair offer.\\nIf you like the offer, we'll send a courier to collect your item.\\nYou'll see the money in your bank account within 24 hours!\\nWhether you want to sell gold, jewelry, or other valuables, we make the process quick and hassle-free.\"}]},{\"id\":\"security\",\"title\":\"Security, Privacy \u0026 Disagreements\",\"faqs\":[{\"q\":\"Do transactions made at Pawno's platform affect my credit history?\",\"a\":\"Not at all! We keep your information private and don't share any transaction details or personal data with banks or lending institutions.\"},{\"q\":\"Can you guarantee that my item will be protected at the pawnshop where it's stored when I pawn through Pawno's platform?\",\"a\":\"We take security seriously. All items are fully insured through the courier company.  Our partner warehouses are 100% secure and protected 24/7 with advanced security systems.\"},{\"q\":\"What happens if I disagree with the final assessment?\",\"a\":\"If you're not happy with the final assessment, no worries! You can take your item back at no cost from the pawnshops. If you want the pawnshop to send it back by courier, there's a postage fee, which you can pay through your Pawno.io account.\"}]},{\"id\":\"futureServices\",\"title\":\"Future Services\",\"faqs\":[{\"q\":\"Does Pawno provide loans against cryptocurrency collateral?\",\"a\":\"Not yet, but stay tuned!\"},{\"q\":\"Does Pawno provide loans against collateral for cars?\",\"a\":\"Car loans are coming soon!\"}]},{\"id\":\"contact\",\"title\":\"Contact\",\"faqs\":[{\"q\":\"How can I contact Pawno?\",\"a\":\"Can't find what you're looking for in our Help Center? No problem! Drop us an email at help@pawno.io or use our Chat window to speak with a Pawno administrator. We're here to help with all your online pawn shop needs, whether you want to pawn gold, sell jewelry, or get a loan on electronics!\"}]}]},\"calculator\":{\"common\":{\"warning-estimated-value\":\"Indicative market price. Final loan amount subject to pawnshop evaluation.\",\"updated-every-x\":\"Updated every \u003cimportant\u003e{time}\u003c/important\u003e\",\"price-source\":\"Pricing data source: \u003clink\u003eMetalPriceAPI\u003c/link\u003e\",\"input-select-placeholder\":\"--select--\",\"proceed-to-loan\":\"Proceed to Loan\",\"submit-application\":\"Proceed with your application\",\"loan-term\":\"Loan Term\",\"days\":\"days\",\"seconds\":\"seconds\",\"grams\":\"grams\"},\"tabs\":{\"metals\":\"Metals\",\"jewelry\":\"Jewelry\",\"electronics\":\"Electronics\",\"watches\":\"Watches\",\"accessories\":\"Accessories\"},\"estimated-loan\":{\"title\":\"Estimated Loan Amount\",\"description\":\"Based on current market rates and item condition.\",\"updated-every-x\":\"Updated every \u003cimportant\u003e{time}\u003c/important\u003e\",\"seconds\":\"seconds\",\"note\":\"\u003cimportant\u003eNote:\u003c/important\u003e This amount is based on current market pricing and the item details provided. The final loan amount will be confirmed by the pawnshop after assessment.\"},\"calculator-metals\":{\"title\":\"Calculate credit\",\"big-title\":\"Precious Metal Calcula
